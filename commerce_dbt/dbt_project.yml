name: commerce_dbt
version: "2.0.0"
profile: commerce_dbt
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target

vars:
  dq_orders_min_rows: 100
  dq_max_load_age_hours: 26

models:
  commerce_dbt:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
    monitoring:
      +schema: monitoring
      +materialized: table

data_tests:
  commerce_dbt:
    +store_failures: true
    +schema: monitoring

flags:
  send_anonymous_usage_stats: false
